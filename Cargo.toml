[workspace]
resolver = "3"
members = ["client", "common", "server"]

[workspace.package]
edition = "2024"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
bb8 = "0.9.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
futures = { version = "0.3", features = [] }
interprocess = { version = "2.4.6", features = ["tokio"] }
mlua = { version = "0.12", features = [
  "lua54",
  "vendored",
  "serde",
  "error-send",
] }
postcard = { version = "1", features = ["use-std", "alloc"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = "0.13.5"
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2" }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
